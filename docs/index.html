  <body class="bg-slate-50 text-slate-900 font-sans selection:bg-klein selection:text-white antialiased transition-colors duration-200">
    <div id="root"></div>

    <!-- Theme Controller Script -->
    <script>
      (function() {
        // Default to Light Mode (eye-soothing morning experience) unless dark was explicitly chosen
        var saved = localStorage.getItem('sdoc-theme');
        var theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.className = theme;
        document.documentElement.setAttribute('data-theme', theme);

        function updateToggleBtn(btn, current) {
          if (!btn) return;
          if (current === 'dark') {
            btn.innerHTML = '<span>🌙</span><span>Dark Mode</span>';
            btn.title = 'Switch to Light Mode (Morning Friendly)';
          } else {
            btn.innerHTML = '<span>☀️</span><span>Light Mode</span>';
            btn.title = 'Switch to Dark Mode';
          }
        }

        function mountThemeToggle() {
          var nav = document.querySelector('header nav');
          if (!nav || document.getElementById('sdoc-theme-btn')) return;

          var btn = document.createElement('button');
          btn.id = 'sdoc-theme-btn';
          btn.type = 'button';
          btn.className = 'sdoc-theme-toggle';
          btn.setAttribute('aria-label', 'Toggle theme mode');
          
          var current = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          updateToggleBtn(btn, current);

          btn.onclick = function() {
            var isDark = document.documentElement.classList.contains('dark');
            var next = isDark ? 'light' : 'dark';
            document.documentElement.className = next;
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('sdoc-theme', next);
            updateToggleBtn(btn, next);
          };

          // Insert toggle right before nav children or prepend
          nav.insertBefore(btn, nav.firstChild);
        }

        // Run mounting on DOMContentLoaded and observe React hydration
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mountThemeToggle);
        } else {
          mountThemeToggle();
        }

        var observer = new MutationObserver(function() {
          mountThemeToggle();
        });
        observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
        setTimeout(function() { observer.disconnect(); }, 5000);
      })();
    </script>
